name: docchan-replies
on:
  schedule:
    - cron: '17 */3 * * *'   # 3時間ごと
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1なら返信を送らず、表示だけ'
        default: '1'
permissions:
  contents: write
concurrency: docchan-replies
jobs:
  reply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reply to YouTube comments
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || vars.DRY_RUN || '1' }}
        run: cd replies && python3 yt_reply.py
      - name: Save state
        run: |
          git config user.name docchan-bot && git config user.email docchan-bot@users.noreply.github.com
          git add replies/yt_state.json replies/pending.json
          git diff --cached --quiet || (git commit -m "replies: update state" && git pull --rebase -q && git push -q)
